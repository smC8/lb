  /DirectDebitMandates:
    get:
      tags:
      - "DirectDebitMandates"
      summary: "Gets a page of direct debit mandates for a claimant."
      description: "Returns a single page of mandates matching the supplied claimant\
        \ and optional filters.\r\nUse the `page` and `perPage` query parameters to\
        \ page through the results;\r\npaging metadata is returned in the response\
        \ headers. The results cannot be sorted and are\r\nreturned in the order they\
        \ are stored."
      operationId: "listDirectDebitMandates"
      parameters:
      - name: "claimantNationalId"
        in: "query"
        description: "The claimant's national ID (kennitala), provided as ten digits\
          \ with or without a dash. Required."
        required: true
        schema:
          pattern: "^[0-9]{6}-?[0-9]{4}$"
          type: "string"
      - name: "categoryCode"
        in: "query"
        description: "Optional filter by mandate category code."
        schema:
          type: "string"
      - name: "payorNationalId"
        in: "query"
        description: "Optional filter by the payor's national ID (kennitala), provided\
          \ as ten digits with or without a dash."
        schema:
          pattern: "^[0-9]{6}-?[0-9]{4}$"
          type: "string"
      - name: "customerNumber"
        in: "query"
        description: "Optional filter by the customer number (payor identifier assigned\
          \ by the claimant)."
        schema:
          type: "string"
      - name: "Accept-Language"
        in: "header"
        description: "The language for human-readable text that originates from payment\
          \ processing, such as `errorMessage` on a failed payment: `is` (Icelandic,\
          \ the default) or `en` (English). Request validation messages are always\
          \ in English."
        schema:
          enum:
          - "is"
          - "en"
          type: "string"
          default: "is"
      - name: "page"
        in: "query"
        description: "The requested page. Defaults to 1 if not specified."
        allowEmptyValue: true
        schema:
          minimum: 1
          type: "integer"
          format: "int32"
          default: 1
      - name: "perPage"
        in: "query"
        description: "The requested page size. Defaults to 100 if not specified. Maximum\
          \ allowed is 500."
        allowEmptyValue: true
        schema:
          maximum: 500
          minimum: 1
          type: "integer"
          format: "int32"
          default: 100
      responses:
        "200":
          description: "OK"
          headers:
            X-Paging-Page:
              description: "The current page."
              schema:
                type: "integer"
                format: "int32"
            X-Paging-PerPage:
              description: "The current page size."
              schema:
                type: "integer"
                format: "int32"
            X-Paging-TotalItems:
              description: "The total items of data available."
              schema:
                type: "integer"
                format: "int32"
            X-Paging-TotalPages:
              description: "The total pages of data available."
              schema:
                type: "integer"
                format: "int32"
            Link:
              description: "Links for first page, next page, prev page, and last page."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/MandateResponse"
                  page:
                    type: "integer"
                    description: "The current page."
                    format: "int32"
                  perPage:
                    type: "integer"
                    description: "The current page size."
                    format: "int32"
                  totalItems:
                    type: "integer"
                    description: "The total items of data available."
                    format: "int32"
                  totalPages:
                    type: "integer"
                    description: "The total pages of data available."
                    format: "int32"
            text/json:
              schema:
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/MandateResponse"
                  page:
                    type: "integer"
                    description: "The current page."
                    format: "int32"
                  perPage:
                    type: "integer"
                    description: "The current page size."
                    format: "int32"
                  totalItems:
                    type: "integer"
                    description: "The total items of data available."
                    format: "int32"
                  totalPages:
                    type: "integer"
                    description: "The total pages of data available."
                    format: "int32"
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401":
          description: "Unauthorized"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "Forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: "Internal Server Error"
          content:

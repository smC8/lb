    BatchStatus:
      enum:
      - "created"
      - "pendingApproval"
      - "pending"
      - "processing"
      - "completed"
      - "cancelled"
      - "rejected"
      - "suspended"
      type: "string"
      description: "The processing status of a payment batch.\r\n`created`: created,\
        \ not yet submitted. `pendingApproval`: stored, awaits approval before it\
        \ is executed.\r\n`pending`: scheduled, waiting to be executed. `processing`:\
        \ payments are being executed. `suspended`: processing paused.\r\n`completed`:\
        \ every payment has been processed. `cancelled`: cancelled before execution.\
        \ `rejected`: refused."

  /DomesticBatches:
    post:
      tags:
      - "DomesticBatches"
      summary: "Initiates a new domestic payments batch."
      description: "Returns `201 Created` when `isStp` is true and the batch has been\
        \ submitted for execution, or `202 Accepted`\r\nwhen `isStp` is false and\
        \ the batch is stored awaiting approval. Both carry the batch ID and\r\nits\
        \ initial status in the body, and a `Location` header pointing at the GET\
        \ endpoint for the batch.\r\n            \r\n`Idempotency-Key` is optional\
        \ and makes the request safe to retry. A repeat with the same key from the\r\
        \nsame application to this operation within 24 hours returns the original\
        \ response instead of creating a\r\nsecond batch; a repeat while the first\
        \ request is still being processed returns `409 Conflict`.\r\nThe request\
        \ body is not compared. Use a new key for a different batch."
      operationId: "createDomesticBatch"
      parameters:
      - name: "Idempotency-Key"
        in: "header"
        description: "Optional idempotency key; see the operation description."
        schema:
          type: "string"
      - name: "Accept-Language"
        in: "header"
        description: "The language for human-readable text that originates from payment\
          \ processing, such as `errorMessage` on a failed payment: `is` (Icelandic,\
          \ the default) or `en` (English). Request validation messages are always\
          \ in English."
        schema:
          enum:
          - "is"
          - "en"
          type: "string"
          default: "is"
      requestBody:
        description: "The domestic batch request."
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/DomesticPaymentsBatchRequest"
              description: "Request to initiate a batch of domestic payments."
              example:
                batchName: "Salaries October 2026"
                isStp: false
                isAggregate: false
                rollbackOnError: true
                debtorAccount:
                  bban: "015926007654"
                  nationalId: "0101302399"
                paymentDate: "2026-10-01"
                creditTransfers:
                - instructedAmount:
                    amount: 450000
                    currency: "ISK"
                  creditorAccount:
                    bban: "010826123456"
                    nationalId: "4502692119"
                  remittanceInformationUnstructured: "Salary October 2026"
                  debtorReference: "SAL-2026-10-001"
                claims:
                - instructedAmount:
                    amount: 25000
                    currency: "ISK"
                  claim:
                    claimNumber: "053026000001"
                    claimantNationalId: "4502692119"
          text/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/DomesticPaymentsBatchRequest"
              description: "Request to initiate a batch of domestic payments."
              example:
                batchName: "Salaries October 2026"
                isStp: false
                isAggregate: false
                rollbackOnError: true
                debtorAccount:
                  bban: "015926007654"
                  nationalId: "0101302399"
                paymentDate: "2026-10-01"
                creditTransfers:
                - instructedAmount:
                    amount: 450000
                    currency: "ISK"
                  creditorAccount:
                    bban: "010826123456"
                    nationalId: "4502692119"
                  remittanceInformationUnstructured: "Salary October 2026"
                  debtorReference: "SAL-2026-10-001"
                claims:
                - instructedAmount:
                    amount: 25000
                    currency: "ISK"
                  claim:
                    claimNumber: "053026000001"
                    claimantNationalId: "4502692119"
          application/*+json:
            schema:
              allOf:
              - $ref: "#/components/schemas/DomesticPaymentsBatchRequest"
              description: "Request to initiate a batch of domestic payments."
              example:
                batchName: "Salaries October 2026"
                isStp: false
                isAggregate: false
                rollbackOnError: true
                debtorAccount:
                  bban: "015926007654"
                  nationalId: "0101302399"
                paymentDate: "2026-10-01"
                creditTransfers:
                - instructedAmount:
                    amount: 450000
                    currency: "ISK"
                  creditorAccount:
                    bban: "010826123456"
                    nationalId: "4502692119"
                  remittanceInformationUnstructured: "Salary October 2026"
                  debtorReference: "SAL-2026-10-001"
                claims:
                - instructedAmount:
                    amount: 25000
                    currency: "ISK"
                  claim:
                    claimNumber: "053026000001"
                    claimantNationalId: "4502692119"
        required: true
      responses:
        "201":
          description: "The batch has been submitted for execution (`isStp` true).\
            \ `Location` points at the batch."
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: "#/components/schemas/BatchInitiationResponse"
            text/json:
              schema:
                properties:
                  data:
                    $ref: "#/components/schemas/BatchInitiationResponse"
        "202":
          description: "The batch is stored and awaits approval before it is executed\
            \ (`isStp` false). `Location` points at the batch."
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: "#/components/schemas/BatchInitiationResponse"
            text/json:
              schema:
                properties:
                  data:
                    $ref: "#/components/schemas/BatchInitiationResponse"
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401":
          description: "Unauthorized"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "Forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: "A request with the same `Idempotency-Key` is still being processed;\
            \ retry after it completes."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: "Internal Server Error"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /DomesticBatches/{id}:

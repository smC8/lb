---
openapi: "3.0.4"
info:
  title: "Payments API"
  description: "Initiate and retrieve domestic and international payments, payment\
    \ batches, card deposits, claim payments, and direct debit mandates."
  version: "v1"
servers:
- url: "https://apisandbox.landsbankinn.is/api/Payments/Payments/v1"
paths:
  /CardDeposits:
    post:
      tags:
      - "CardDeposits"
      summary: "Initiates a new card deposit."
      description: "Returns `201 Created` when `isStp` is true and the deposit has\
        \ been executed, or `202 Accepted`\r\nwhen `isStp` is false and the deposit\
        \ is stored awaiting approval. Both carry the payment ID and\r\nits initial\
        \ status in the body, and a `Location` header pointing at the GET endpoint\
        \ for the payment.\r\n            \r\n`Idempotency-Key` is optional and makes\
        \ the request safe to retry. A repeat with the same key from the\r\nsame application\
        \ to this operation within 24 hours returns the original response instead\
        \ of creating a\r\nsecond deposit; a repeat while the first request is still\
        \ being processed returns `409 Conflict`.\r\nThe request body is not compared.\
        \ Use a new key for a different deposit."
      operationId: "createCardDeposit"
      parameters:
      - name: "Idempotency-Key"
        in: "header"
        description: "Optional idempotency key; see the operation description."
        schema:
          type: "string"
      - name: "Accept-Language"
        in: "header"
        description: "The language for human-readable text that originates from payment\
          \ processing, such as `errorMessage` on a failed payment: `is` (Icelandic,\
          \ the default) or `en` (English). Request validation messages are always\
          \ in English."
        schema:
          enum:
          - "is"
          - "en"
          type: "string"
          default: "is"
      requestBody:
        description: "The card deposit request."
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/CardDepositRequest"
              description: "Request to initiate a deposit to a payment card."
              example:
                isStp: true
                debtorAccount:
                  bban: "015926007654"
                  nationalId: "0101302399"
                card:
                  cardNumber: "4111111111111111"
                instructedAmount:
                  amount: 10000
                  currency: "ISK"
                remittanceInformationUnstructured: "Card top-up"
          text/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/CardDepositRequest"
              description: "Request to initiate a deposit to a payment card."
              example:
                isStp: true
                debtorAccount:
                  bban: "015926007654"
                  nationalId: "0101302399"
                card:
                  cardNumber: "4111111111111111"
                instructedAmount:
                  amount: 10000
                  currency: "ISK"
                remittanceInformationUnstructured: "Card top-up"
          application/*+json:
            schema:
              allOf:
              - $ref: "#/components/schemas/CardDepositRequest"
              description: "Request to initiate a deposit to a payment card."
              example:
                isStp: true
                debtorAccount:
                  bban: "015926007654"
                  nationalId: "0101302399"
                card:
                  cardNumber: "4111111111111111"
                instructedAmount:
                  amount: 10000
                  currency: "ISK"
                remittanceInformationUnstructured: "Card top-up"
        required: true
      responses:
        "201":
          description: "The deposit has been executed (`isStp` true). `Location` points\
            \ at the payment."
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: "#/components/schemas/PaymentInitiationResponse"
            text/json:
              schema:
                properties:
                  data:
                    $ref: "#/components/schemas/PaymentInitiationResponse"
        "202":
          description: "The deposit is stored and awaits approval before it is executed\
            \ (`isStp` false). `Location` points at the payment."
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: "#/components/schemas/PaymentInitiationResponse"
            text/json:
              schema:
                properties:
                  data:
                    $ref: "#/components/schemas/PaymentInitiationResponse"
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401":
          description: "Unauthorized"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "Forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: "A request with the same `Idempotency-Key` is still being processed;\
            \ retry after it completes."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: "Internal Server Error"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /CardDeposits/{id}:
    get:
      tags:
      - "CardDeposits"
      summary: "Gets a card deposit by its ID."
      operationId: "getCardDeposit"
      parameters:
      - name: "id"
        in: "path"
        description: "The ID returned from the POST endpoint."
        required: true

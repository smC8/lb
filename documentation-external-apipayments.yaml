        exchangeRate:
          allOf:
          - $ref: "#/components/schemas/ExchangeRateResponse"
          description: "Exchange rate information if applicable."
          nullable: true
        isFuturePayment:
          type: "boolean"
          description: "Indicates whether this is a future-dated payment."
        isPeriodicPayment:
          type: "boolean"
          description: "Indicates whether this is a periodic (recurring) payment."
      additionalProperties: false
      description: "Details and current processing status of a domestic credit transfer."
      example:
        id: "sandbox-pay-001"
        status: "completed"
        paymentDate: "2026-10-01"
        instructedAmount:
          amount: 25000
          currency: "ISK"
        debtorAccount:
          bban: "015926007654"
          nationalId: "0101302399"
        creditorAccount:
          bban: "010826123456"
          nationalId: "4502692119"
        categoryCode: "03"
        remittanceInformationUnstructured: "Invoice 2026-118"
        debtorReference: "INV-2026-118"
        endToEndIdentification: "E2E-2026-118"
        isFuturePayment: false
        isPeriodicPayment: false
    DateRange:
      type: "object"
      properties:
        from:
          type: "string"
          description: "Start date of the range (inclusive)."
          format: "date"
          nullable: true
        to:
          type: "string"
          description: "End date of the range (inclusive)."
          format: "date"
          nullable: true
      additionalProperties: false
      description: "An inclusive date range. Either bound may be omitted."
    DomesticPaymentsBatchRequest:
      required:
      - "claims"
      - "creditTransfers"
      - "isAggregate"
      - "isStp"
      - "rollbackOnError"
      type: "object"
      properties:
        batchName:
          maxLength: 45
          pattern: "^[a-zA-Z0-9ÁáÉéÍíÓóÚúÝýÆæÖöÐðÞþ@+()\\t'/.,*:\\- _]*$"
          type: "string"
          description: "Optional name used to identify the batch. Maximum 45 characters."
          nullable: true
        isStp:
          type: "boolean"
          description: "Whether the batch should bypass manual approval when permitted."
        isAggregate:
          type: "boolean"
          description: "Whether all payments should be debited as one aggregate withdrawal."
        rollbackOnError:
          type: "boolean"
          description: "Whether all payments should be rolled back if one payment\
            \ fails."
        categoryCode:
          type: "string"
          description: "Default payment category code for the batch."
          nullable: true
        debtorAccount:
          allOf:
          - $ref: "#/components/schemas/AccountIdentification"
          description: "Default account from which payments are debited."
          nullable: true
        paymentDate:
          type: "string"
          description: "Requested payment date for the batch."
          format: "date"
          nullable: true
        creditTransfers:
          type: "array"
          items:
            $ref: "#/components/schemas/CreditTransferBatchPaymentElement"
          description: "Domestic credit transfers included in the batch."
        claims:
          type: "array"
          items:
            $ref: "#/components/schemas/ClaimBatchPaymentElement"
          description: "Claim payments included in the batch."
      additionalProperties: false
      description: "Request to initiate a batch of domestic payments."
      example:
        batchName: "Salaries October 2026"
        isStp: false
        isAggregate: false
        rollbackOnError: true
        debtorAccount:
          bban: "015926007654"
          nationalId: "0101302399"
        paymentDate: "2026-10-01"
        creditTransfers:
        - instructedAmount:
            amount: 450000
            currency: "ISK"
          creditorAccount:
            bban: "010826123456"
            nationalId: "4502692119"
          remittanceInformationUnstructured: "Salary October 2026"
          debtorReference: "SAL-2026-10-001"
        claims:
        - instructedAmount:
            amount: 25000
            currency: "ISK"
          claim:
            claimNumber: "053026000001"
            claimantNationalId: "4502692119"
    ExchangeRateCalculationMethod:
      enum:
      - "multiplier"
      - "divider"
      type: "string"
      description: "How an exchange rate is applied to convert between the instructed\
        \ and debited currency."
    ExchangeRateResponse:
      required:
      - "rate"
      type: "object"
      properties:
        rate:
          type: "number"
          description: "The exchange rate applied."
          format: "double"
        calculationMethod:
          allOf:
          - $ref: "#/components/schemas/ExchangeRateCalculationMethod"
          description: "Whether the rate multiplies or divides the instructed amount\
            \ to give the debited amount."
          nullable: true
        debitedAmount:
          allOf:
          - $ref: "#/components/schemas/Money"
          description: "The amount debited from the debtor account after conversion,\
            \ with its currency."
          nullable: true
        debtorCapitalGainsTaxRate:
          type: "number"
          description: "The exchange rate recorded for capital gains taxation. When\
            \ a payment is debited from a\r\nforeign-currency account, Icelandic tax\
            \ rules treat the conversion as a realisation of the\r\ncurrency holding,\
            \ and the gain or loss is assessed against this rate. It is an exchange\
            \ rate,\r\nnot a tax percentage, and may differ from `rate`. Present only\
            \ for foreign-currency\r\ndebtor accounts."
          format: "double"
          nullable: true
      additionalProperties: false
      description: "The exchange rate applied to a currency-converting payment, from\
        \ the debtor's side."
    MandateInitiationResponse:
      required:
      - "id"
      type: "object"
      properties:
        id:
          type: "string"
          description: "The identifier used to retrieve the mandate."
      additionalProperties: false
      description: "The identifier returned after creating a direct debit mandate."
      example:
        id: "sandbox-mandate-001"
    MandateResponse:
      required:
      - "claimantNationalId"
      - "id"
      - "payorNationalId"
      - "status"
      type: "object"
      properties:
        id:
          type: "string"
          description: "The unique mandate identifier."
        claimantNationalId:
          pattern: "^[0-9]{10}$"
          type: "string"
          description: "The claimant's national ID (kennitala), returned as ten digits\
            \ without a dash."
        payorNationalId:
          pattern: "^[0-9]{10}$"
          type: "string"
          description: "The payor's national ID (kennitala), returned as ten digits\
            \ without a dash."
        status:
          allOf:
          - $ref: "#/components/schemas/MandateStatus"
          description: "The current state of the mandate."
        debtorAccount:
          allOf:
          - $ref: "#/components/schemas/AccountIdentificationResponse"
          description: "The account payments are withdrawn from, with the account\
            \ holder's national ID."
          nullable: true
        categoryCode:
          type: "string"
          description: "The mandate category code."
          nullable: true
        customerNumber:
          type: "string"
          description: "The unique payor identifier assigned by the claimant (e.g.\
            \ meter number, loan number)."
          nullable: true
        bank:
          type: "string"
          description: "The claimant's bank (branch) number."
          nullable: true
        validationPeriod:
          allOf:
          - $ref: "#/components/schemas/DateRange"
          description: "The period during which the mandate is valid, as supplied\
            \ when it was created. Either bound may be\r\nnull when the mandate is\
            \ open-ended on that side; null altogether when no period was set."
          nullable: true
      additionalProperties: false
      description: "A single direct debit mandate. Fields not available for the mandate\
        \ are null."
      example:
        id: "sandbox-mandate-001"
        claimantNationalId: "4502692119"
        payorNationalId: "0101302399"
        status: "active"
        debtorAccount:
          bban: "015926007654"
          nationalId: "0101302399"
        categoryCode: "KH"
        customerNumber: "1505658480"
        bank: "0159"
        validationPeriod:
          from: "2026-10-01"
          to: "2027-09-30"
    MandateStatus:
      enum:
      - "draft"
      - "pendingValidation"
      - "reopened"
      - "suspended"
      - "active"
      - "closed"
      type: "string"
      description: "The state of a direct debit mandate.\r\n`draft`: registration\
        \ has begun but is not complete. `pendingValidation`: awaits confirmation.\r\
        \n`reopened`: opened for changes. `suspended`: payments are paused. `active`:\
        \ confirmed and\r\nin use. `closed`: no longer in effect."
    MandateType:
      enum:
      - "ikClaim"
      - "rbLoan"
      - "creditCard"
      - "bankLoan"
      type: "string"
      description: "The type of a direct debit mandate.\r\n`ikClaim`: an Icelandic-format\
        \ claim. `rbLoan`: a loan serviced by the Icelandic banks' central\r\nsystem;\
        \ the customer number is the 12-digit loan number. `creditCard`: a credit\
        \ card.\r\n`bankLoan`: a loan in another bank system."
    Money:
      required:
      - "amount"
      - "currency"
      type: "object"
      properties:
        amount:
          type: "number"
          description: "The amount, as a number."
          format: "double"
          example: 1250.23
        currency:
          pattern: "^[A-Z]{3}$"
          type: "string"
          description: "The three-letter uppercase ISO 4217 currency code."
          example: "ISK"
      additionalProperties: false
      description: "A monetary amount together with its currency."
    PaymentInitiationResponse:
      required:
      - "id"
      - "status"
      type: "object"
      properties:
        status:
          allOf:
          - $ref: "#/components/schemas/PaymentStatus"
          description: "The initial status of the payment."
        id:
          type: "string"
          description: "The payment identifier used to retrieve the payment."
      additionalProperties: false
      description: "The identifier and initial status returned after payment initiation."
      example:
        status: "received"
        id: "sandbox-pay-001"
    PaymentStatus:
      enum:
      - "unknown"
      - "received"
      - "processing"
      - "pending"
      - "pendingApproval"
      - "suspended"
      - "completed"
      - "deleted"
      - "rejected"
      - "recalled"
      - "cancelled"
      type: "string"
      description: "The processing status of a payment.\r\n`received`: accepted, not\
        \ yet processed. `pendingApproval`: stored, awaits approval before it is executed.\r\
        \n`pending`: scheduled, waiting to be executed. `processing`: being executed.\
        \ `suspended`: processing paused.\r\n`completed`: executed. `deleted`: removed\
        \ before execution. `rejected`: refused. `recalled`: reversed after execution.\r\
        \n`cancelled`: cancelled before execution. `unknown`: the status could not\
        \ be determined; retry the request later."
    ProblemDetails:
      type: "object"
      properties:
        type:
          type: "string"
          description: "A URI reference that identifies the problem type. When dereferenced\
            \ it should provide human-readable documentation for the problem type."
          nullable: true
        title:
          type: "string"
          description: "A short, human-readable summary of the problem type. It should\
            \ not change between occurrences of the same problem."
          nullable: true
        status:
          type: "integer"
          description: "The HTTP status code generated by the origin server for this\
            \ occurrence of the problem."
          format: "int32"
          nullable: true
        detail:
          type: "string"
          description: "A human-readable explanation specific to this occurrence of\
            \ the problem."
          nullable: true
        instance:
          type: "string"
          description: "A URI reference that identifies the specific occurrence of\
            \ the problem."
          nullable: true
      additionalProperties: {}
      description: "A machine-readable description of an error, as defined in RFC\
        \ 9457 (Problem Details for HTTP APIs)."
      example:
        type: "https://datatracker.ietf.org/doc/html/rfc9110#section-15.5.3"
        title: "Forbidden"
        status: 403
        traceId: "00-c07f6fdbb44f4e3e0251817d03aea458-b8fa12fe654a091a-00"
    UltimateParty:
      type: "object"
      properties:
        name:
          type: "string"
          description: "Name of the ultimate debtor or creditor."
          nullable: true
        nationalId:
          pattern: "^[0-9]{6}-?[0-9]{4}$"
          type: "string"
          description: "National ID (kennitala) of the ultimate debtor or creditor.\
            \ Accepted as ten digits with or without\r\na dash; returned as ten digits\
            \ without a dash."
          nullable: true
      additionalProperties: false
      description: "Details of an ultimate debtor or creditor when different from\
        \ the account holder."
    ValidationProblemDetails:
      required:
      - "errors"
      type: "object"
      properties:
        type:
          type: "string"
          description: "A URI reference that identifies the problem type. When dereferenced\
            \ it should provide human-readable documentation for the problem type."
          nullable: true
        title:
          type: "string"
          description: "A short, human-readable summary of the problem type. It should\
            \ not change between occurrences of the same problem."
          nullable: true
        status:
          type: "integer"
          description: "The HTTP status code generated by the origin server for this\
            \ occurrence of the problem."
          format: "int32"
          nullable: true
        detail:
          type: "string"
          description: "A human-readable explanation specific to this occurrence of\
            \ the problem."
          nullable: true
        instance:
          type: "string"
          description: "A URI reference that identifies the specific occurrence of\
            \ the problem."
          nullable: true
        errors:
          type: "object"
          additionalProperties:
            type: "array"
            items:
              type: "string"
          description: "A dictionary mapping each invalid input field to a list of\
            \ human-readable error messages describing why the value was rejected."
      additionalProperties: {}
      description: "A machine-readable description of a validation error, as defined\
        \ in RFC 9457 (Problem Details for HTTP APIs). The errors extension member\
        \ contains a dictionary that maps each invalid input field to a list of human-readable\
        \ error messages."
      example:
        type: "https://datatracker.ietf.org/doc/html/rfc9110#section-15.5.1"
        title: "One or more validation errors occurred."
        status: 400
        errors:
          nationalId:
          - "Kennitalan er ekki á réttu formi."
        traceId: "00-c07f6fdbb44f4e3e0251817d03aea458-b8fa12fe654a091a-00"
tags:
- name: "CardDeposits"
  description: "Initiate deposits to payment cards and retrieve previously initiated\
    \ card deposits."
- name: "ClaimPayments"
  description: "Initiate payments of Icelandic claims and retrieve previously initiated\
    \ claim payments."
- name: "CreditTransfers"
  description: "Initiate domestic credit transfers and retrieve previously initiated\
    \ transfers."
- name: "DirectDebitMandates"
  description: "Create and retrieve direct debit mandates that authorise recurring\
    \ or future payments."
- name: "DomesticBatches"
  description: "Initiate batches of domestic payments and retrieve their status and\
    \ individual payments."

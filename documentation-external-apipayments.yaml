  /DomesticBatches/{id}/Payments:
    get:
      tags:
      - "DomesticBatches"
      summary: "Gets the individual payments of a domestic batch."
      description: "Returns every payment in the batch as a single list. Each item\
        \ carries a `type`\r\ndiscriminator (`creditTransfer` or `claimPayment`) that\
        \ identifies\r\nits payment type and which type-specific fields are present.\
        \ The response is not paged;\r\nuse `status` to narrow the result. Send `Accept-Language`\
        \ (`is` or `en`) to\r\nreceive `errorMessage` in that language; Icelandic\
        \ is the default. A payment's `id` is\r\nassigned when it is processed, so\
        \ items in a batch that is awaiting approval or scheduled have no\r\n`id`\
        \ yet."
      operationId: "listDomesticBatchPayments"
      parameters:
      - name: "id"
        in: "path"
        description: "The batch ID."
        required: true
        schema:
          type: "string"
      - name: "status"
        in: "query"
        description: "Filter for the payments to return (all, success or error). Defaults\
          \ to all."
        schema:
          allOf:
          - $ref: "#/components/schemas/BatchPaymentStatusFilter"
          description: "Filter for the payments returned by GET /DomesticBatches/{id}/Payments."
          default: "all"
      - name: "Accept-Language"
        in: "header"
        description: "The language for human-readable text that originates from payment\
          \ processing, such as `errorMessage` on a failed payment: `is` (Icelandic,\
          \ the default) or `en` (English). Request validation messages are always\
          \ in English."
        schema:
          enum:
          - "is"
          - "en"
          type: "string"
          default: "is"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: "array"
                    items:
                      oneOf:
                      - $ref: "#/components/schemas/BatchCreditTransferPaymentResponse"
                      - $ref: "#/components/schemas/BatchClaimPaymentResponse"
                      description: "A single payment within a batch. The `type` discriminator\
                        \ identifies the payment type\r\n(`creditTransfer` or `claimPayment`)\
                        \ and which type-specific fields are present."
            text/json:
              schema:
                properties:
                  data:
                    type: "array"
                    items:
                      oneOf:
                      - $ref: "#/components/schemas/BatchCreditTransferPaymentResponse"
                      - $ref: "#/components/schemas/BatchClaimPaymentResponse"
                      description: "A single payment within a batch. The `type` discriminator\
                        \ identifies the payment type\r\n(`creditTransfer` or `claimPayment`)\
                        \ and which type-specific fields are present."
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401":
          description: "Unauthorized"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "Forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: "Not Found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: "Internal Server Error"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    AccountIdentification:
      type: "object"
      properties:
        iban:
          type: "string"
          description: "International Bank Account Number."
          nullable: true
        bban:
          type: "string"
          description: "Basic Bank Account Number, the domestic account number format."
          nullable: true
        nationalId:
          pattern: "^[0-9]{6}-?[0-9]{4}$"
          type: "string"
          description: "The account holder's national ID (kennitala), provided as\
            \ ten digits with or without a dash.\r\nRequired when the account is identified\
            \ by BBAN without an IBAN."
          nullable: true
      additionalProperties: false
      description: "Identifies an Icelandic account by IBAN or BBAN together with\
        \ the account holder's national ID\r\n(kennitala). Domestic payments generally\
        \ use a BBAN, in which case the national ID is required;\r\nan Icelandic IBAN\
        \ may be supplied instead and is converted to its BBAN. Either an IBAN or\
        \ a BBAN\r\nmust be provided."
    AccountIdentificationResponse:
      type: "object"
      properties:
        bban:
          type: "string"
          description: "Basic Bank Account Number (Icelandic format)."
          nullable: true
        iban:
          type: "string"
          description: "International Bank Account Number."
          nullable: true
        nationalId:
          pattern: "^[0-9]{10}$"
          type: "string"
          description: "The account holder's national ID (kennitala), returned as\
            \ ten digits without a dash."
          nullable: true
        name:
          type: "string"
          description: "Account holder's name. Optional; only populated on batch payment\
            \ creditor accounts."
          nullable: true
      additionalProperties: false
      description: "Shared account identification for responses: BBAN, IBAN and national\
        \ ID (kennitala),\r\nplus an optional account holder name. The account holder\
        \ name is only populated\r\non batch payment creditor accounts; it is left\
        \ null for all other payment types."
    BatchClaimPaymentResponse:
      allOf:
      - $ref: "#/components/schemas/BatchPaymentResponse"
      - required:
        - "principalAmount"
        type: "object"
        properties:
          principalAmount:
            allOf:
            - $ref: "#/components/schemas/Money"
            description: "The principal amount (instructed amount minus the claim\
              \ cost breakdown total). Carries the\r\ncurrency of the instructed amount;\
              \ ISK when that is not available."
          claim:
            allOf:
            - $ref: "#/components/schemas/ClaimResponse"
            description: "The claim that was paid."
            nullable: true
        additionalProperties: false
      description: "Response model for a single claim payment within a batch."
      example:
        type: "claimPayment"
        principalAmount:
          amount: 24500
          currency: "ISK"
        claim:
          claimNumber: "053026000001"
          claimantNationalId: "4502692119"
          dueDate: "2026-10-01"
          isPartialPayment: false
          costBreakdown:
            totalAmount: 500
            noticeAndPaymentFeePaid: 500
            defaultChargePaid: 0
            otherCostPaid: 0
            otherDefaultCostPaid: 0
            defaultInterestPaid: 0
            discountGiven: 0
        id: "sandbox-pay-005"
        status: "rejected"
        errorSubject: "Claim"
        errorMessage: "Krafan er þegar greidd."
        instructedAmount:
          amount: 25000
          currency: "ISK"
        paymentDate: "2026-10-01"
        debtorAccount:
          bban: "015926007654"
          nationalId: "0101302399"
    BatchCreditTransferPaymentResponse:
      allOf:
      - $ref: "#/components/schemas/BatchPaymentResponse"
      - type: "object"
        properties:
          creditorAccount:
            allOf:
            - $ref: "#/components/schemas/AccountIdentificationResponse"
            description: "The creditor's account details."
            nullable: true
          ultimateDebtor:
            allOf:
            - $ref: "#/components/schemas/UltimateParty"
            description: "Ultimate debtor party information."
            nullable: true
          ultimateCreditor:
            allOf:
            - $ref: "#/components/schemas/UltimateParty"
            description: "Ultimate creditor party information."
            nullable: true
          exchangeRate:
            allOf:
            - $ref: "#/components/schemas/ExchangeRateResponse"
            description: "Exchange rate information if applicable."
            nullable: true
        additionalProperties: false
      description: "Response model for a single credit transfer payment within a batch."
      example:
        type: "creditTransfer"
        creditorAccount:
          bban: "010826123456"
          nationalId: "4502692119"
        id: "sandbox-pay-004"
        status: "completed"
        instructedAmount:
          amount: 450000
          currency: "ISK"
        paymentDate: "2026-10-01"
        remittanceInformationUnstructured: "Salary October 2026"
        debtorReference: "SAL-2026-10-001"
        debtorAccount:
          bban: "015926007654"
          nationalId: "0101302399"
    BatchInitiationResponse:
      required:
      - "id"
      - "status"
      type: "object"
      properties:
        id:
          type: "string"
          description: "The identifier used to retrieve the batch."
        status:
          allOf:
          - $ref: "#/components/schemas/BatchStatus"
          description: "The initial status of the batch."
      additionalProperties: false
      description: "The identifier and initial status returned after batch initiation."
      example:
        id: "LB0000123"
        status: "pendingApproval"
    BatchPaymentResponse:
      required:
      - "status"
      - "type"
      type: "object"
      properties:
        type:
          type: "string"
          description: "Discriminator identifying the payment type: `creditTransfer`\
            \ or `claimPayment`."
          readOnly: true
        id:
          type: "string"
          description: "The payment identifier, usable with the corresponding `GET\
            \ /CreditTransfers/{id}` or\r\n`GET /ClaimPayments/{id}`. Null until the\
            \ payment has been processed: payments in a batch that\r\nis awaiting\
            \ approval or scheduled have no identifier yet."
          nullable: true
        status:
          allOf:
          - $ref: "#/components/schemas/PaymentStatus"
          description: "Current status of the payment."
        errorSubject:
          type: "string"
          description: "Error subject when the payment failed."
          nullable: true
        errorMessage:
          type: "string"
          description: "Human-readable error message when the payment failed, in the\
            \ language requested with the\r\n`Accept-Language` header (Icelandic by\
            \ default)."
          nullable: true
        instructedAmount:
          allOf:
          - $ref: "#/components/schemas/Money"
          description: "The instructed amount and currency."
          nullable: true
        paymentDate:
          type: "string"
          description: "The requested payment date."
          format: "date"
          nullable: true
        categoryCode:
          type: "string"
          description: "Payment category code."
          nullable: true
        remittanceInformationUnstructured:
          maxLength: 140
          type: "string"
          description: "Unstructured remittance information."
          nullable: true
        endToEndIdentification:
          maxLength: 35
          type: "string"
          description: "End-to-end identification provided by the initiating party."
          nullable: true
        debtorReference:
          maxLength: 16
          type: "string"
          description: "Debtor reference for reconciliation. Maximum 16 characters."
          nullable: true
        debtorAccount:
          allOf:
          - $ref: "#/components/schemas/AccountIdentificationResponse"
          description: "The debtor's account details."
          nullable: true
      additionalProperties: false
      description: "A single payment within a batch. The `type` discriminator identifies\
        \ the payment type\r\n(`creditTransfer` or `claimPayment`) and which type-specific\
        \ fields are present."
      discriminator:
        propertyName: "type"
        mapping:
          creditTransfer: "#/components/schemas/BatchCreditTransferPaymentResponse"
          claimPayment: "#/components/schemas/BatchClaimPaymentResponse"
    BatchPaymentStatusFilter:
      enum:
      - "all"
      - "success"
      - "error"
      type: "string"
      description: "Filter for the payments returned by GET /DomesticBatches/{id}/Payments."
    BatchResponse:
      required:
      - "errorPaymentCount"
      - "id"
      - "isAggregate"
      - "isStp"
      - "paidPaymentCount"
      - "status"
      - "suspendedPaymentCount"
      - "totalAmount"
      - "totalPaymentCount"
      type: "object"
      properties:
        id:
          type: "string"
          description: "Unique identifier for the batch."
        batchName:
          type: "string"
          description: "Human-readable batch name."
          nullable: true
        isStp:
          type: "boolean"
          description: "Straight-through processing flag."
        isAggregate:
          type: "boolean"
          description: "Indicates if this is an aggregate batch."
        paymentDate:
          type: "string"
          description: "The requested payment date for the batch."
          format: "date"
          nullable: true
        status:
          allOf:
          - $ref: "#/components/schemas/BatchStatus"
          description: "Current status of the batch."
        totalAmount:
          allOf:
          - $ref: "#/components/schemas/Money"
